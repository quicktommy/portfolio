    <script>
        (() => {
            const platform =
                navigator.userAgentData?.platform ||
                navigator.platform ||
                "";

            const isWindowsOrMac = /Windows|Win|Mac/i.test(platform);
            const prefersLight = window.matchMedia(
                "(prefers-color-scheme: light)"
            ).matches;

            document.documentElement.dataset.theme =
                isWindowsOrMac && prefersLight ? "light" : "dark";
        })();
    </script>
